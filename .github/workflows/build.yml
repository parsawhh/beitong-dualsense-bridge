name: Build and Release Windows Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Translation Engine DLL (MSVC cl)
        run: |
          cl /O2 /LD /W3 ds2bt_engine.c /Fe:ds2bt_engine.dll

      - name: Build Native Linux Tests
        shell: bash
        run: |
          clang -O2 ds2bt_engine.c test_engine.c -o test_engine
          ./test_engine

      - name: Upload Windows Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beitong-dualsense-windows-build
          path: |
            *.dll
            *.exe
            ui/
